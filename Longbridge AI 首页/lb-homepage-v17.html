<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Longbridge Web · v17 · Signal 卡片 + Signal 详情</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--sf:#111115;--sf2:#18181e;--sf3:#202028;--bd:rgba(255,255,255,.06);--bda:rgba(255,255,255,.12);--tp:#e8e9ed;--ts:#8b8d97;--tm:#5a5c66;--td:#3a3b42;--g:#00d4a1;--gbg:rgba(0,212,161,.08);--r:#ff4d6a;--rbg:rgba(255,77,106,.08);--o:#ff9f43;--obg:rgba(255,159,67,.08);--b:#4da6ff;--bbg:rgba(77,166,255,.08);--p:#a78bfa;--pbg:rgba(167,139,250,.08);--c:#22d3ee;--cbg:rgba(34,211,238,.08);--ai:#6ee7b7;--aibg:rgba(110,231,183,.05);--f:'DM Sans',-apple-system,sans-serif;--m:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--f);background:var(--bg);color:var(--tp);height:100vh;overflow:hidden;font-size:12px}
.shell{display:flex;flex-direction:column;height:100vh}

/* TOP NAV */
.tn{height:60px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 24px;gap:20px;flex-shrink:0;z-index:30}
.tn-logo{display:flex;align-items:center;gap:10px;cursor:pointer;flex-shrink:0}
.tn-logo-mark{display:flex;align-items:flex-end;gap:2px;height:24px}
.tn-logo-bar{width:4px;border-radius:1px}
.tn-logo-bar:nth-child(1){height:11px;background:#ea4e3d}
.tn-logo-bar:nth-child(2){height:18px;background:#f7b32b}
.tn-logo-bar:nth-child(3){height:24px;background:#2ab673}
.tn-logo-bar:nth-child(4){height:15px;background:#3fa9f5}
.tn-logo-text{display:flex;flex-direction:column;line-height:1}
.tn-logo-subtitle{font-size:9px;font-weight:500;color:var(--ts);letter-spacing:.3px}
.tn-logo-title{font-size:14px;font-weight:800;color:var(--tp);letter-spacing:.5px;margin-top:1px}
.tn-indices{display:flex;align-items:center;gap:18px;flex-shrink:0}
.tn-index{display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer}
.tn-index-icon{width:5px;height:11px;border-radius:1px;background:var(--r);flex-shrink:0}
.tn-index-name{color:var(--tp);font-weight:500;font-size:11px;max-width:48px;overflow:hidden;text-overflow:ellipsis}
.tn-index-value{color:var(--tp);font-weight:500;font-size:11px;font-family:var(--m)}
.tn-index-arrow{color:var(--r);font-size:8px}
.tn-index-change{color:var(--r);font-size:11px;font-family:var(--m);white-space:nowrap}
.tn-index.up .tn-index-icon,.tn-index.up .tn-index-arrow,.tn-index.up .tn-index-change{color:var(--g)}
.tn-index.up .tn-index-icon{background:var(--g)}
.tn-sp{flex:1}
.tn-menu{display:flex;align-items:center;gap:4px}
.tn-mi{padding:6px 12px;font-size:12px;color:var(--ts);font-weight:500;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:3px;white-space:nowrap}
.tn-mi:hover{color:var(--tp);background:var(--sf2)}
.tn-mi-caret{font-size:8px;margin-top:1px}
.tn-icons{display:flex;align-items:center;gap:4px;margin-left:12px}
.tn-ic{width:30px;height:30px;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ts)}
.tn-ic:hover{background:var(--sf2);color:var(--tp)}
.tn-ic svg{width:15px;height:15px}
.tn-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--g),#00b890);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;cursor:pointer;margin-left:4px}

.bd{flex:1;display:flex;overflow:hidden}

/* ICON NAV */
.in{width:52px;background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0}
.ni{width:40px;height:40px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--tm);position:relative;gap:1px}
.ni:hover{background:var(--sf2);color:var(--ts)}
.ni.on{color:var(--g);background:var(--gbg)}
.ni svg{width:15px;height:15px}
.ni span{font-size:8px;font-weight:500}
.ni-s{width:22px;height:1px;background:var(--bd);margin:3px 0}
.ni-b{position:absolute;top:2px;right:2px;min-width:14px;height:14px;border-radius:7px;background:var(--r);font-size:8px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 3px}

.fr{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ==================================================
   NEW LAYOUT RHYTHM: 导航 → 浏览 → 详情 → AI 工作台 → chat
   ================================================== */
.mr{flex:1;display:flex;overflow:hidden}

/* MAIN (1st after icon-nav) */
.mc{flex:1;overflow-y:auto;min-width:0;scrollbar-width:thin;scrollbar-color:var(--sf3) transparent}
.mc::-webkit-scrollbar{width:3px}.mc::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:2px}
.vw{display:none;padding:14px 18px}.vw.on{display:block}

/* DETAIL (2nd - between main and AI workbench, slides in from right of main) */
.dp{width:0;overflow:hidden;border-left:1px solid transparent;background:var(--sf);flex-shrink:0;transition:width .3s cubic-bezier(.4,0,.2,1),border-color .3s ease;position:relative}
.dp.open{width:320px;border-left-color:var(--bd)}
.dp-inner{width:320px;padding:14px;overflow-y:auto;height:100%;scrollbar-width:thin;scrollbar-color:var(--sf3) transparent}
.dp-close{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:4px;border:none;background:var(--sf2);color:var(--ts);cursor:pointer;font-size:11px;z-index:2}
.dp-close:hover{background:var(--sf3);color:var(--tp)}

/* AI 工作台 (3rd - between detail and chat) */
.aw{width:240px;border-left:1px solid var(--bd);background:var(--sf);flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;transition:width .3s cubic-bezier(.4,0,.2,1)}
.aw.compact{width:208px}
.aw-hd{padding:10px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:6px;flex-shrink:0}
.aw-hd-icon{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--ai),#34d399);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#000}
.aw-hd-t{font-size:11px;font-weight:600}
.aw-hd-s{margin-left:auto;font-size:8px;color:var(--tm);font-family:var(--m)}
.aw-body{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:var(--sf3) transparent}
.aw-body::-webkit-scrollbar{width:3px}.aw-body::-webkit-scrollbar-thumb{background:var(--sf3);border-radius:2px}
.aw-sec{font-size:8px;text-transform:uppercase;letter-spacing:.8px;color:var(--tm);font-weight:600;margin-top:6px;display:flex;align-items:center;gap:4px;padding:0 2px}
.aw-sec:first-child{margin-top:0}
.aw-sec-count{background:var(--sf3);padding:1px 5px;border-radius:8px;font-weight:500;color:var(--ts);font-size:8px;letter-spacing:0}
.aw-card{background:var(--sf2);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;cursor:pointer;position:relative;transition:all .15s}
.aw-card:hover{border-color:var(--bda)}
.aw-card.run{border-left:2px solid var(--o)}
.aw-card.ok{border-left:2px solid var(--g)}
.aw-card.warn{border-left:2px solid var(--r);animation:warn-glow 2s infinite}
.aw-card.paused{border-left:2px solid var(--tm);opacity:.75}
@keyframes warn-glow{0%,100%{background:var(--sf2)}50%{background:rgba(255,77,106,.06)}}
.aw-card-h{display:flex;align-items:center;gap:4px;margin-bottom:3px}
.aw-card-status{font-size:7px;padding:1px 5px;border-radius:2px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.aw-card-status.run{background:var(--obg);color:var(--o)}
.aw-card-status.ok{background:var(--gbg);color:var(--g)}
.aw-card-status.warn{background:var(--rbg);color:var(--r)}
.aw-card-status.paused{background:var(--sf3);color:var(--tm)}
.aw-card-title{font-size:10px;font-weight:600;margin-bottom:3px;line-height:1.35}
.aw-card-desc{font-size:9px;color:var(--ts);line-height:1.4;margin-bottom:4px}
.aw-card-meta{display:flex;flex-direction:column;gap:2px}
.aw-card-kv{display:flex;justify-content:space-between;gap:6px;font-size:9px}
.aw-card-k{color:var(--tm)}
.aw-card-v{color:var(--tp);font-family:var(--m)}
.aw-card-progress{height:2px;background:var(--sf3);border-radius:1px;margin-top:5px;overflow:hidden}
.aw-card-progress-bar{height:100%;background:var(--o);border-radius:1px;transition:width .3s}
.aw-card-actions{display:flex;gap:4px;margin-top:6px}
.aw-act-btn{padding:3px 6px;border-radius:3px;border:1px solid var(--bd);background:transparent;color:var(--ts);font-size:9px;font-family:var(--f);cursor:pointer;flex:1}
.aw-act-btn:hover{border-color:var(--bda);color:var(--tp)}
.aw-act-btn.primary{border-color:var(--g);color:var(--g);background:var(--gbg)}

/* CHAT (4th - rightmost) */
.ch{width:280px;display:flex;flex-direction:column;flex-shrink:0;background:var(--sf);border-left:1px solid var(--bd)}
.ch-hd{padding:8px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:5px}
.ch-logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(135deg,var(--ai),#34d399);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#000}
.ch-brand{font-size:11px;font-weight:600}
.ch-tag{margin-left:auto;font-size:8px;padding:2px 6px;border-radius:8px;background:var(--gbg);color:var(--g)}
.ch-tag.live{background:var(--aibg);color:var(--ai)}
.ch-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--sf3) transparent}
.ch-m{max-width:95%}.ch-m.bot{align-self:flex-start}.ch-m.user{align-self:flex-end}
.ch-bub{padding:8px 10px;border-radius:10px;font-size:11px;line-height:1.6}
.ch-m.bot .ch-bub{background:var(--aibg);border:1px solid rgba(110,231,183,.08)}
.ch-m.user .ch-bub{background:var(--sf2);border:1px solid var(--bd)}
.ch-ctx{font-size:8px;color:var(--tm);margin-bottom:2px;display:flex;align-items:center;gap:3px}
.ch-ctx-d{width:4px;height:4px;border-radius:50%;background:var(--g)}
.ch-sugs{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.ch-sug{padding:5px 8px;border-radius:5px;border:1px solid var(--bd);background:transparent;color:var(--ts);font-size:10px;font-family:var(--f);cursor:pointer;text-align:left}
.ch-sug:hover{border-color:var(--ai);color:var(--ai);background:var(--aibg)}

/* GLOBAL INPUT */
.gi{height:54px;background:var(--sf);border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:center;padding:0 14px;flex-shrink:0;position:relative}
.gi-box{width:100%;max-width:720px;display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--bda);border-radius:12px;padding:8px 14px;transition:all .2s;position:relative}
.gi-box:focus-within{border-color:var(--ai);box-shadow:0 0 0 2px rgba(110,231,183,.06)}
.gi-box.live-morph{border-color:var(--ai);box-shadow:0 0 0 2px rgba(110,231,183,.1);background:linear-gradient(to right,var(--sf2),rgba(110,231,183,.04))}
.gi-box input{flex:1;background:transparent;border:none;outline:none;color:var(--tp);font-size:12px;font-family:var(--f)}
.gi-box input::placeholder{color:var(--tm)}
.gi-live-dot{width:6px;height:6px;border-radius:50%;background:var(--ai);animation:pulse 1s infinite;flex-shrink:0;opacity:0;transition:opacity .2s}
.gi-box.live-morph .gi-live-dot{opacity:1}
.gi-hint{font-size:8px;color:var(--td);white-space:nowrap}
.gi-send{width:26px;height:26px;border-radius:6px;border:none;background:var(--g);color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gi-send svg{width:12px;height:12px}
.gi-tries{position:absolute;bottom:58px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:6px 0;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50;max-width:720px;flex-wrap:wrap;justify-content:center}
.gi-tries.show{opacity:1;pointer-events:auto}
.gi-try{padding:4px 10px;border-radius:12px;border:1px solid var(--bda);background:rgba(10,10,13,.95);backdrop-filter:blur(8px);color:var(--ts);font-size:10px;font-family:var(--f);cursor:pointer;white-space:nowrap}
.gi-try:hover{border-color:var(--ai);color:var(--ai);background:var(--aibg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.hint-tip{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);background:rgba(10,10,13,.95);backdrop-filter:blur(8px);color:var(--ts);padding:6px 12px;border-radius:16px;font-size:10px;border:1px solid var(--bda);white-space:nowrap;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:6px}
.hint-tip.show{opacity:1}
.hint-tip-dot{width:5px;height:5px;border-radius:50%;background:var(--ai);animation:pulse 1s infinite}

/* HOME */
.hm-hero{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hm-pf-l{font-size:8px;text-transform:uppercase;letter-spacing:.6px;color:var(--tm)}
.hm-pf-v{font-family:var(--m);font-size:15px;font-weight:700;margin-top:1px}
.hm-pf-c{font-family:var(--m);font-size:10px}
.hm-pf-sep{width:1px;height:24px;background:var(--bd)}
.hm-pf-mini{cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .15s}
.hm-pf-mini:hover{background:var(--sf2)}
.hm-pf-ml{font-size:7px;color:var(--tm);font-family:var(--m)}
.hm-pf-mv{font-family:var(--m);font-size:10px;margin-top:1px}
.positive{color:var(--g)}.negative{color:var(--r)}

.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:12px;font-size:10px;border:1px solid var(--bd);background:var(--sf);cursor:pointer}
.chip-d{width:4px;height:4px;border-radius:50%}
.chip.urg{border-color:rgba(255,77,106,.2)}.chip.urg .chip-d{background:var(--r);animation:pulse 1.5s infinite}
.chip-l{color:var(--tm)}.chip-t{color:var(--tp);font-weight:500}

.tl-hd{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.tl-t{font-size:12px;font-weight:600}.tl-c{font-size:10px;color:var(--g)}
.sc{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent;position:relative;transition:all .15s}
.sc:hover{background:var(--sf);border-color:var(--bd)}
.sc.ur::before{content:'';position:absolute;left:0;top:10px;width:3px;height:18px;border-radius:0 2px 2px 0;background:var(--g)}
.sc-top{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.sc-tag{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:1px 6px;border-radius:3px}
.sc-tag.anomaly{background:var(--rbg);color:var(--r)}.sc-tag.catalyst{background:var(--obg);color:var(--o)}.sc-tag.news{background:var(--bbg);color:var(--b)}.sc-tag.community{background:var(--pbg);color:var(--p)}.sc-tag.system{background:var(--cbg);color:var(--c)}.sc-tag.signal{background:var(--gbg);color:var(--g)}
.sc-tk{font-family:var(--m);font-size:9px;color:var(--tm);padding:1px 5px;border-radius:3px;transition:all .12s;cursor:pointer}
.sc-tk.tk-link{color:var(--b);background:rgba(77,166,255,.06);border:1px solid rgba(77,166,255,.15)}
.sc-tk.tk-link:hover{background:var(--bbg);color:var(--b);border-color:rgba(77,166,255,.3);transform:translateY(-1px)}
.sc-tm{font-size:9px;color:var(--tm);margin-left:auto}
.sc-tx{font-size:11px;line-height:1.5}.sc-rl{font-size:10px;color:var(--ts);margin-top:2px;line-height:1.4}
.sc-rl strong{color:var(--tp);font-weight:500}
.sc.rd .sc-tx{color:var(--ts)}.sc.rd .sc-tag{opacity:.5}.sc.rd::before{display:none}

/* SIGNAL RICH CARD (App-style) */
.sig{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:6px 0;cursor:pointer;transition:all .15s;position:relative}
.sig:hover{border-color:var(--bda)}
.sig.ur::before{content:'';position:absolute;left:0;top:14px;width:3px;height:20px;border-radius:0 2px 2px 0;background:var(--g)}
.sig.rd{opacity:.75}.sig.rd::before{display:none}
.sig-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sig-logo{width:28px;height:28px;border-radius:50%;background:var(--sf3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
.sig-logo img{width:100%;height:100%;object-fit:cover}
.sig-info{flex:1;min-width:0}
.sig-tk{font-family:var(--m);font-size:11px;font-weight:600;color:var(--tp)}
.sig-nm{font-size:10px;color:var(--ts)}
.sig-fav{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:var(--r);font-size:12px;cursor:pointer;flex-shrink:0}
.sig-chart{width:100%;height:48px;background:var(--sf2);border-radius:6px;margin-bottom:8px;overflow:hidden}
.sig-chart canvas{width:100%;height:100%}
.sig-verdict{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;margin-bottom:6px}
.sig-verdict.bullish{background:var(--gbg);color:var(--g)}
.sig-verdict.bearish{background:var(--rbg);color:var(--r)}
.sig-verdict.neutral{background:var(--obg);color:var(--o)}
.sig-title{font-size:13px;font-weight:700;line-height:1.4;margin-bottom:4px;color:var(--tp)}
.sig-desc{font-size:11px;color:var(--ts);line-height:1.5;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sig-footer{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--tm)}
.sig-strategy{padding:1px 6px;border-radius:3px;background:var(--sf2);color:var(--ts);font-size:9px}
.sig-more{font-size:10px;color:var(--b);margin-left:auto;cursor:pointer;display:flex;align-items:center;gap:3px}
.sig-more:hover{color:var(--ai)}

/* SIGNAL DETAIL (full detail panel) */
.sd-back{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ts);cursor:pointer;margin-bottom:10px}
.sd-back:hover{color:var(--tp)}
.sd-back svg{width:14px;height:14px}
.sd-head{margin-bottom:12px}
.sd-head-tk{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sd-head-logo{width:20px;height:20px;border-radius:50%;background:var(--sf3);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0}
.sd-head-code{font-family:var(--m);font-size:11px;color:var(--ts)}
.sd-headline{font-size:15px;font-weight:700;line-height:1.4;margin-bottom:4px}
.sd-meta{font-size:9px;color:var(--tm)}
.sd-section{margin-top:14px}
.sd-section-t{font-size:10px;font-weight:600;color:var(--tp);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.sd-verdict-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sd-verdict-item{background:var(--sf2);border-radius:6px;padding:8px 10px}
.sd-verdict-l{font-size:8px;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.sd-verdict-v{font-size:12px;font-weight:600;font-family:var(--m)}
.sd-verdict-v.sm{font-size:10px}
.sd-verdict-full{grid-column:1/-1;background:var(--sf2);border-radius:6px;padding:8px 10px}
.sd-catalyst{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:6px}
.sd-catalyst-t{font-size:11px;font-weight:600;line-height:1.4;margin-bottom:3px}
.sd-catalyst-desc{font-size:10px;color:var(--ts);line-height:1.5}
.sd-catalyst-src{font-size:8px;color:var(--tm);margin-top:4px;display:flex;align-items:center;gap:4px}

function awCardH(item){
  const statusMap={run:'运行中',ok:'正常',warn:'预警',paused:'已暂停'};
  let h=`<div class="aw-card ${item.status}"><div class="aw-card-h"><span class="aw-card-status ${item.status}">${statusMap[item.status]}</span></div>`;
  h+=`<div class="aw-card-title">${item.title}</div>`;
  h+=`<div class="aw-card-desc">${item.desc}</div>`;
  h+=`<div class="aw-card-meta">`;
  item.kv.forEach(([k,v])=>h+=`<div class="aw-card-kv"><span class="aw-card-k">${k}</span><span class="aw-card-v">${v}</span></div>`);
  h+=`</div>`;
  if(item.progress!==undefined)h+=`<div class="aw-card-progress"><div class="aw-card-progress-bar" style="width:${item.progress}%"></div></div>`;
  if(item.actions){h+=`<div class="aw-card-actions">`;item.actions.forEach((a,i)=>h+=`<button class="aw-act-btn ${i===0?'primary':''}">${a}</button>`);h+=`</div>`}
  h+=`</div>`;return h;
}

function drawSignalCharts(){
  Object.keys(signalDB).forEach(tk=>{
    const c=document.getElementById('sigc-'+tk);if(!c)return;
    const ctx=c.getContext('2d'),w=c.width=c.parentElement.clientWidth,ht=c.height=c.parentElement.clientHeight;
    const s=signalDB[tk],bullish=s.verdict==='bullish';
    const pts=[];let y=ht*.5;
    for(let x=0;x<w;x+=2){y+=(Math.random()-(bullish?.42:.58))*2;y=Math.max(ht*.15,Math.min(ht*.85,y));pts.push({x,y})}
    const rgb=bullish?'0,212,161':'255,77,106';
    const g=ctx.createLinearGradient(0,0,0,ht);g.addColorStop(0,`rgba(${rgb},.1)`);g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.beginPath();ctx.moveTo(0,ht);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(w,ht);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=`rgba(${rgb},.7)`;ctx.lineWidth=1.5;ctx.stroke();
    // End dot
    const last=pts[pts.length-1];
    ctx.beginPath();ctx.arc(last.x,last.y,3,0,Math.PI*2);ctx.fillStyle=`rgba(${rgb},1)`;ctx.fill();
    ctx.beginPath();ctx.arc(last.x,last.y,5,0,Math.PI*2);ctx.fillStyle=`rgba(${rgb},.2)`;ctx.fill();
  });
}

  h+=`<div class="wg"><div class="wg-top"><div class="wg-icon" style="background:${s.pf&&s.pf.p?'var(--gbg)':'var(--rbg)'};color:${s.pf&&s.pf.p?'var(--g)':'var(--r)'}">📈</div><div class="wg-title">Profit & Loss</div><span class="wg-summary ${s.pf&&s.pf.p?'positive':'negative'}">今日 ${s.pf?s.pf.pct:'--'}</span></div>`;
  h+=`<div class="wg-pnl-hero">
    <div><div class="kpi-l">今日盈亏</div><div class="wg-pnl-v ${s.pf&&s.pf.p?'positive':'negative'}">${s.pnlToday}</div></div>
    <canvas class="wg-pnl-chart" id="pnlChart"></canvas>
  </div>`;
  h+=`<div class="wg-pnl-stats">
    <div><div class="wg-pnl-stat-l">本周</div><div class="wg-pnl-stat-v ${s.pnlWeek.startsWith('+')?'positive':'negative'}">${s.pnlWeek}</div></div>
    <div><div class="wg-pnl-stat-l">本月</div><div class="wg-pnl-stat-v ${s.pnlMonth.startsWith('+')?'positive':'negative'}">${s.pnlMonth}</div></div>
    <div><div class="wg-pnl-stat-l">总收益率</div><div class="wg-pnl-stat-v positive">+12.4%</div></div>
  </div>`;
  h+=`</div>`;

  h+=`</div>`;

  document.getElementById('v-home').innerHTML=h;

  // Draw P&L chart
  setTimeout(()=>{
    const c=document.getElementById('pnlChart');if(!c)return;
    const ctx=c.getContext('2d'),w=c.width=c.parentElement.clientWidth,h=c.height=c.parentElement.clientHeight;
    const pos=s.pf.p;const pts=[];let y=h*.5;
    for(let x=0;x<w;x+=2){y+=(Math.random()-(pos?.42:.58))*2.5;y=Math.max(h*.1,Math.min(h*.9,y));pts.push({x,y})}
    const rgb=pos?'0,212,161':'255,77,106';
    const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,`rgba(${rgb},.15)`);g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.beginPath();ctx.moveTo(0,h);pts.forEach(p=>ctx.lineTo(p.x,p.y));ctx.lineTo(w,h);ctx.fillStyle=g;ctx.fill();
    ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=`rgba(${rgb},.8)`;ctx.lineWidth=1.5;ctx.stroke();
  },100);
  setTimeout(drawSignalCharts,150);
}

function evH(e,st){
  const cls=st==='ur'?'ur':'rd';
  // Signal rich card
  if(e.sig&&signalDB[e.tk]){
    const s=signalDB[e.tk];
    return `<div class="sig ${cls}" onclick="openSignalDetail('${e.tk}')">
      <div class="sig-top">
        <div class="sig-logo">${s.logo||s.tk.charAt(0)}</div>
        <div class="sig-info"><div class="sig-tk">${s.tk}</div><div class="sig-nm">${s.nm}</div></div>
        <div class="sig-fav">♥</div>
      </div>
      <div class="sig-chart"><canvas id="sigc-${e.tk}"></canvas></div>
      <div class="sig-verdict ${s.verdict}">${s.verdict==='bullish'?'Bullish':s.verdict==='bearish'?'Bearish':'Neutral'} · ${s.range}</div>
      <div class="sig-title">${s.headline}</div>
      <div class="sig-desc">${s.desc}</div>
      <div class="sig-footer"><span class="sig-strategy">${s.strategy}</span><span>${s.time}</span></div>
    </div>`;
  }
  // Normal event card
  const isKnown=knownTickers.includes(e.tk);
  const tkClass=isKnown?'sc-tk tk-link':'sc-tk';
  const tkAttr=isKnown?`onclick="clickTickerPill(event,'${e.tk}','${e.tx.replace(/'/g,"\\'")}')"`:'';
  return `<div class="sc ${cls}" onclick="markEventRead(this)"><div class="sc-top"><span class="sc-tag ${e.c}">${e.tag}</span><span class="${tkClass}" ${tkAttr}>${e.tk}${isKnown?' →':''}</span><span class="sc-tm">${e.tm}</span></div><div class="sc-tx">${e.tx}</div><div class="sc-rl">${e.rl}</div></div>`;
}

function renderChat(){
  const s=S[sc],el=document.getElementById('chm');let h='';
  if(s.ai.msg)h+=`<div class="ch-m bot"><div class="ch-ctx"><span class="ch-ctx-d"></span>基于持仓和事件</div><div class="ch-bub">${s.ai.msg}</div></div>`;
  if(s.ai.sugs){h+=`<div class="ch-sugs">`;s.ai.sugs.forEach(t=>h+=`<button class="ch-sug" onclick="clickSug(this)">${t}</button>`);h+=`</div>`}
  el.innerHTML=h;el.scrollTop=el.scrollHeight;
}
function clickSug(b){tryIntent(b.textContent)}

document.getElementById('gin').addEventListener('input',e=>handleLiveInput(e.target.value));
document.getElementById('gin').addEventListener('keydown',e=>{if(e.key==='Enter')sendG()});

renderAll();
</script>
